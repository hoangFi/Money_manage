<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Quỹ Chung wallet mark: wallet body, clasp with a hole, card slot, and an in/out arrow.
       Holes are cut with masks so the mark works on any background colour (fill = currentColor). -->
  <defs>
    <mask id="body-cut">
      <rect width="64" height="64" fill="#fff" />
      <rect x="18" y="11" width="21" height="14" rx="4.5" fill="#000" />
      <rect x="38" y="16.5" width="24" height="19" rx="6.5" fill="#000" />
      <path d="M26.5 29 19.5 37h4.8v4.5h4.4V37h4.8zM26.5 54l7-8h-4.8v-3.5h-4.4V46h-4.8z" fill="#000" />
    </mask>
    <mask id="clasp-cut">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="49" cy="26" r="3.2" fill="#000" />
    </mask>
  </defs>
  <g fill="currentColor">
    <path mask="url(#body-cut)" d="M17 6h29a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H18a6 6 0 0 1-4.2-1.8L9.8 52A6 6 0 0 1 8 47.8V16.4a6 6 0 0 1 1.8-4.2l3-3A6 6 0 0 1 17 6z" />
    <rect mask="url(#clasp-cut)" x="41" y="19" width="18" height="14" rx="4.5" />
  </g>
</svg>
